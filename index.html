<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Project | Rock Paper Scissors</title>
  </head>
  <style>
    html {
      font-family:
        "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    }

    button {
      border: 1px solid black;
      border-radius: 5px;
      cursor: pointer;
      padding: 0.5em 1em;
    }

    button:hover {
      background-color: rgba(0, 0, 0, 0.468);
      color: white;
    }

    button:disabled {
      cursor: not-allowed;
    }
  </style>
  <body>
    <div class="container">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
    </div>
    <div id="reset"></div>
    <h1 id="gameResult"></h1>
    <p id="scores"></p>
    <h4 id="selections"></h4>
    <ul id="roundResults"></ul>
    <script>
      // DOM Traversals
      const rock = document.querySelector("#rock");
      const paper = document.querySelector("#paper");
      const scissors = document.querySelector("#scissors");
      const roundResults = document.querySelector("#roundResults");
      const gameResult = document.querySelector("#gameResult");
      const scores = document.querySelector("#scores");
      const selections = document.querySelector("#selections");
      const container = document.querySelector(".container");

      // Dedicated choices array to make disabling safe
      const choiceButtons = [rock, paper, scissors];

      const resetButton = document.createElement("button");
      resetButton.textContent = "Reset";

      // Global Score Tracking state for the game cycle
      let humanScore = 0;
      let computerScore = 0;

      // Generates a choice for the computer
      function getComputerChoice() {
        let randomNumber = Math.floor(Math.random() * 3);
        if (randomNumber === 0) return "rock";
        if (randomNumber === 1) return "paper";
        if (randomNumber === 2) return "scissors";
        return null;
      }

      function checkEndGame() {
        // Endgame condition checks
        if (humanScore === 5 || computerScore === 5) {
          // Disable choice buttons only (leaves Reset button active!)
          choiceButtons.forEach((button) => (button.disabled = true));
          container.append(resetButton);

          if (humanScore > computerScore) {
            gameResult.textContent = "Player Wins!";
          } else {
            gameResult.textContent = "Computer Wins!";
          }
        }
      }

      // Round logic processing
      function playRound(humanChoice, computerChoice) {
        selections.textContent = `Player: ${humanChoice} | Computer: ${computerChoice}`;

        // Main winning scenarios
        if (humanChoice === computerChoice) {
          const list = document.createElement("li");
          list.textContent = "It's a tie! Both chose " + humanChoice;
          roundResults.append(list);
        } else if (humanChoice === "rock" && computerChoice === "scissors") {
          const list = document.createElement("li");
          list.textContent = "You win! rock beats scissors.";
          roundResults.append(list);
          humanScore += 1;
        } else if (humanChoice === "paper" && computerChoice === "rock") {
          const list = document.createElement("li");
          list.textContent = "You win! paper beats rock.";
          roundResults.append(list);
          humanScore += 1;
        } else if (humanChoice === "scissors" && computerChoice === "paper") {
          const list = document.createElement("li");
          list.textContent = "You win! scissors beats paper.";
          roundResults.append(list);
          humanScore += 1;
        } else {
          const list = document.createElement("li");
          list.textContent =
            "You lose! " + computerChoice + " beats " + humanChoice;
          computerScore += 1;
          roundResults.append(list);
        }

        scores.textContent = `Scores : Player: ${humanScore} | Computer: ${computerScore}`;

        checkEndGame();
      }

      // Master Game Setup Initialization Function
      function playGame() {
        // Choice Action Listeners
        rock.addEventListener("click", () => {
          playRound("rock", getComputerChoice());
        });
        paper.addEventListener("click", () => {
          playRound("paper", getComputerChoice());
        });
        scissors.addEventListener("click", () => {
          playRound("scissors", getComputerChoice()); // Fixed typo here!
        });

        // Reset Listener configured safely exactly once
        resetButton.addEventListener("click", () => {
          gameResult.textContent = "";
          scores.textContent = "";
          roundResults.textContent = "";
          selections.textContent = "";

          // Enable game buttons
          choiceButtons.forEach((button) => (button.disabled = false));
          resetButton.remove();

          // Wipe scores
          humanScore = 0;
          computerScore = 0;
        });
      }

      // Fire Up game listener logic loop execution
      playGame();
    </script>
  </body>
</html>
